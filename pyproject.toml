[project]
name = "ocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.0",
    "matplot>=0.1.9",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pydantic>=2.14.1",
    "seaborn>=0.13.2",
    "seqeval>=1.2.2",
    "torch>=2.9.1",
    "torchmetrics>=1.9.0",
    "transformers>=5.20.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "data",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.src]
exclude = ["notebooks"]
